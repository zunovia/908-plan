name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Restore debug keystore cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Generate debug keystore if not cached
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Voxna Debug,O=Sur Communication,C=JP"

      - name: Generate Android project
        run: |
          flutter create --project-name zero_app --org com.voxna --platforms android --no-pub .
          git checkout -- pubspec.yaml l10n.yaml

      - name: Configure build.gradle
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.voxna.zero_app"/applicationId = "app.voxna.android"/' android/app/build.gradle.kts
            sed -i 's/namespace = "com.voxna.zero_app"/namespace = "app.voxna.android"/' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/minSdk = .*$/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*$/targetSdk = 35/' android/app/build.gradle.kts
            sed -i '/^plugins {/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts
            if [ -f android/settings.gradle.kts ]; then
              sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            fi
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId = "com.voxna.zero_app"/applicationId = "app.voxna.android"/' android/app/build.gradle
            sed -i "s/applicationId \"com.voxna.zero_app\"/applicationId \"app.voxna.android\"/" android/app/build.gradle
            sed -i 's/namespace = "com.voxna.zero_app"/namespace = "app.voxna.android"/' android/app/build.gradle
            sed -i "s/namespace \"com.voxna.zero_app\"/namespace \"app.voxna.android\"/" android/app/build.gradle
            sed -i "s/minSdk = flutter.minSdkVersion/minSdk = 23/" android/app/build.gradle
            sed -i "s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/" android/app/build.gradle
            sed -i "s/targetSdk = flutter.targetSdkVersion/targetSdk = 35/" android/app/build.gradle
            sed -i "s/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 35/" android/app/build.gradle
            echo "" >> android/app/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
            if [ -f android/settings.gradle ]; then
              sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
            elif [ -f android/build.gradle ]; then
              sed -i '/dependencies {/a\        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
            fi
          fi

      - name: Upgrade AGP and Gradle for 16KB page size support
        run: |
          # Upgrade AGP to 8.7.0
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.7.0"/' android/settings.gradle
          elif [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.7.0"/' android/settings.gradle.kts
          fi
          # Upgrade Gradle wrapper to 8.9 (required by AGP 8.7.0)
          sed -i 's|gradle-.*-all.zip|gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Relocate MainActivity to match namespace
        run: |
          # Find where flutter create put MainActivity
          echo "=== Searching for MainActivity ==="
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" -type f 2>/dev/null | head -1)
          echo "Found: ${MAIN_KT:-not found}"
          if [ -z "$MAIN_KT" ]; then
            echo "ERROR: MainActivity.kt not found anywhere under android/app/src/main/"
            find android/app/src/main -type f 2>/dev/null
            exit 1
          fi
          # Determine the target directory (same parent type: kotlin/ or java/)
          if echo "$MAIN_KT" | grep -q "/kotlin/"; then
            DST_DIR="android/app/src/main/kotlin/app/voxna/android"
          else
            DST_DIR="android/app/src/main/java/app/voxna/android"
          fi
          mkdir -p "$DST_DIR"
          sed 's/^package .*/package app.voxna.android/' "$MAIN_KT" > "$DST_DIR/MainActivity.kt"
          echo "Relocated to: $DST_DIR/MainActivity.kt"
          cat "$DST_DIR/MainActivity.kt"
          # Remove old com/ tree
          SRC_ROOT=$(echo "$MAIN_KT" | sed 's|/com/.*|/com|')
          rm -rf "$SRC_ROOT"

      - name: Fix AndroidManifest for correct MainActivity reference
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Before ==="
          grep "android:name" "$MANIFEST" || true
          sed -i 's/android:name="\.MainActivity"/android:name="app.voxna.android.MainActivity"/' "$MANIFEST"
          echo "=== After ==="
          grep "android:name" "$MANIFEST" || true

      - name: Add Android permissions for recording
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

      - name: Set app label to Voxna
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="zero_app"/android:label="Voxna"/' "$MANIFEST"

      - name: Add proguard rules
        run: cp proguard-rules.pro android/app/proguard-rules.pro

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Place google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify DEX contains MainActivity and targetSdk
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          # Locate Android SDK tools (not in default PATH on GitHub Actions)
          DEXDUMP=$(find "$ANDROID_HOME/build-tools" -name "dexdump" -type f 2>/dev/null | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" -type f 2>/dev/null | sort -V | tail -1)
          echo "dexdump: $DEXDUMP"
          echo "aapt2: $AAPT2"
          # Extract DEX files and verify MainActivity exists
          WORK_DIR=$(mktemp -d)
          unzip -o "$APK" "classes*.dex" -d "$WORK_DIR"
          FOUND=false
          for DEX in "$WORK_DIR"/classes*.dex; do
            if "$DEXDUMP" "$DEX" 2>/dev/null | grep -q "app/voxna/android/MainActivity"; then
              echo "MainActivity found in $(basename $DEX)"
              FOUND=true
              break
            fi
          done
          rm -rf "$WORK_DIR"
          if [ "$FOUND" = false ]; then
            echo "::error::MainActivity not found in DEX - ClassNotFoundException will occur at runtime"
            exit 1
          fi
          echo "MainActivity verified in DEX"
          # Verify targetSdkVersion >= 35
          TARGET_SDK=$("$AAPT2" dump badging "$APK" 2>/dev/null | grep -oP "targetSdkVersion:'\K[0-9]+" || echo "")
          if [ -z "$TARGET_SDK" ] || [ "$TARGET_SDK" -lt 35 ]; then
            echo "::error::targetSdkVersion is ${TARGET_SDK:-unknown}, must be >= 35"
            exit 1
          fi
          echo "targetSdkVersion=$TARGET_SDK (>= 35)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voxna-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Generate Android project
        run: |
          flutter create --project-name zero_app --org com.voxna --platforms android --no-pub .
          git checkout -- pubspec.yaml l10n.yaml

      - name: Decode upload keystore from secret
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE }}" | base64 -d > android/app/upload-keystore.jks

      - name: Configure build.gradle for release
        run: |
          # Write key.properties
          printf 'storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}\nkeyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' > android/key.properties
          # Remove KTS files to avoid Groovy/KTS conflict
          rm -f android/app/build.gradle.kts android/settings.gradle.kts
          # Replace generated Groovy DSL files with repo templates
          cp android-templates/app-build.gradle android/app/build.gradle
          cp android-templates/settings.gradle android/settings.gradle
          # Upgrade Gradle wrapper to 8.9 (required by AGP 8.7.0)
          sed -i 's|gradle-.*-all.zip|gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Relocate MainActivity to match namespace
        run: |
          # Find where flutter create put MainActivity
          echo "=== Searching for MainActivity ==="
          MAIN_KT=$(find android/app/src/main -name "MainActivity.kt" -type f 2>/dev/null | head -1)
          echo "Found: ${MAIN_KT:-not found}"
          if [ -z "$MAIN_KT" ]; then
            echo "ERROR: MainActivity.kt not found anywhere under android/app/src/main/"
            find android/app/src/main -type f 2>/dev/null
            exit 1
          fi
          # Determine the target directory (same parent type: kotlin/ or java/)
          if echo "$MAIN_KT" | grep -q "/kotlin/"; then
            DST_DIR="android/app/src/main/kotlin/app/voxna/android"
          else
            DST_DIR="android/app/src/main/java/app/voxna/android"
          fi
          mkdir -p "$DST_DIR"
          sed 's/^package .*/package app.voxna.android/' "$MAIN_KT" > "$DST_DIR/MainActivity.kt"
          echo "Relocated to: $DST_DIR/MainActivity.kt"
          cat "$DST_DIR/MainActivity.kt"
          # Remove old com/ tree
          SRC_ROOT=$(echo "$MAIN_KT" | sed 's|/com/.*|/com|')
          rm -rf "$SRC_ROOT"

      - name: Fix AndroidManifest for correct MainActivity reference
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          echo "=== Before ==="
          grep "android:name" "$MANIFEST" || true
          sed -i 's/android:name="\.MainActivity"/android:name="app.voxna.android.MainActivity"/' "$MANIFEST"
          echo "=== After ==="
          grep "android:name" "$MANIFEST" || true

      - name: Add Android permissions for recording
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"

      - name: Set app label to Voxna
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="zero_app"/android:label="Voxna"/' "$MANIFEST"

      - name: Add proguard rules
        run: cp proguard-rules.pro android/app/proguard-rules.pro

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Place google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify DEX contains MainActivity and targetSdk
        run: |
          AAB="build/app/outputs/bundle/release/app-release.aab"
          # Locate Android SDK tools
          DEXDUMP=$(find "$ANDROID_HOME/build-tools" -name "dexdump" -type f 2>/dev/null | sort -V | tail -1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" -type f 2>/dev/null | sort -V | tail -1)
          # Extract base module DEX from AAB for inspection
          unzip -o "$AAB" "base/dex/*" -d /tmp/aab-extract
          FOUND=false
          for DEX in /tmp/aab-extract/base/dex/*.dex; do
            if "$DEXDUMP" "$DEX" 2>/dev/null | grep -q "app/voxna/android/MainActivity"; then
              echo "MainActivity found in $(basename $DEX)"
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = false ]; then
            echo "::error::MainActivity not found in DEX - ClassNotFoundException will occur at runtime"
            exit 1
          fi
          echo "MainActivity verified in DEX"
          # Verify targetSdkVersion >= 35
          TARGET_SDK=$("$AAPT2" dump xmltree --file base/manifest/AndroidManifest.xml "$AAB" 2>/dev/null | grep -oP 'targetSdkVersion.*?=\K[0-9]+' || echo "")
          if [ -n "$TARGET_SDK" ] && [ "$TARGET_SDK" -lt 35 ]; then
            echo "::error::targetSdkVersion is $TARGET_SDK, must be >= 35"
            exit 1
          fi
          echo "targetSdkVersion check passed"
          rm -rf /tmp/aab-extract

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: voxna-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
